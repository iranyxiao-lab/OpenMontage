apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: openmontage-test
resources:
  - namespace.yaml
  - ../../base
images:
  - name: openmontage-runner
    newName: registry.example.invalid/openmontage
    newTag: test
patches:
  - target:
      kind: Deployment
      name: openmontage-render-.*
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: 250m
  - target:
      kind: Deployment
      name: openmontage-(planner|render)-(stable|canary)
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/envFrom/-
        value:
          secretRef:
            name: openmontage-providers
            optional: true
