apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: openmontage-test
commonLabels:
  app.kubernetes.io/part-of: openmontage
resources:
  - serviceaccount.yaml
  - workers.yaml
  - metrics-service.yaml
  - policies.yaml
  - quota.yaml
patches:
  - target:
      kind: Deployment
    patch: |-
      - op: add
        path: /spec/template/spec/imagePullSecrets
        value:
          - name: deepthink-docker-registry-key
      - op: add
        path: /spec/template/spec/containers/0/envFrom
        value:
          - secretRef:
              name: openmontage-oss
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: {name: OPENMONTAGE_OBJECT_STORE, value: oss}
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: {name: OPENMONTAGE_OSS_BUCKET, value: openmontage-oss}
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: {name: OPENMONTAGE_OSS_REGION, value: us-east-1}
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: {name: OPENMONTAGE_OSS_ENDPOINT, value: oss-us-east-1.aliyuncs.com}
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: {name: OPENMONTAGE_REQUIRE_GRANTS, value: "true"}
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: OPENMONTAGE_REDIS_URL
          valueFrom:
            secretKeyRef:
              name: openmontage-redis
              key: url
  - target:
      kind: Deployment
      name: openmontage-(planner|render)-(stable|canary)
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/envFrom/-
        value:
          secretRef:
            name: openmontage-providers
            optional: true
