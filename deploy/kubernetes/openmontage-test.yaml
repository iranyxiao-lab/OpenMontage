apiVersion: v1
kind: ServiceAccount
metadata:
  name: openmontage
  namespace: test
  labels:
    app.kubernetes.io/name: openmontage
    app.kubernetes.io/part-of: soulx
automountServiceAccountToken: false
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: openmontage-projects
  namespace: test
  labels:
    app.kubernetes.io/name: openmontage
    app.kubernetes.io/part-of: soulx
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: soulx-nas
  resources:
    requests:
      storage: 50Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openmontage
  namespace: test
  labels:
    app.kubernetes.io/name: openmontage
    app.kubernetes.io/part-of: soulx
spec:
  replicas: 1
  revisionHistoryLimit: 5
  progressDeadlineSeconds: 1800
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: openmontage
  template:
    metadata:
      labels:
        app.kubernetes.io/name: openmontage
        app.kubernetes.io/part-of: soulx
    spec:
      serviceAccountName: openmontage
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      imagePullSecrets:
        - name: deepthink-docker-registry-key
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: openmontage
          image: __OPENMONTAGE_IMAGE__
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 4750
              protocol: TCP
          env:
            - name: BACKLOT_PORT
              value: "4750"
            - name: OPENMONTAGE_PROJECTS_DIR
              value: /workspace/projects
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            - name: HOME
              value: /home/node
            - name: XDG_CACHE_HOME
              value: /home/node/.cache
          envFrom:
            - secretRef:
                name: openmontage-providers
                optional: true
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
              ephemeral-storage: 2Gi
            limits:
              cpu: "4"
              memory: 8Gi
              ephemeral-storage: 20Gi
          startupProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 5"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: projects
              mountPath: /workspace/projects
            - name: backlot-cache
              mountPath: /workspace/.backlot
            - name: tmp
              mountPath: /tmp
            - name: node-cache
              mountPath: /home/node/.cache
            - name: npm-cache
              mountPath: /home/node/.npm
      volumes:
        - name: projects
          persistentVolumeClaim:
            claimName: openmontage-projects
        - name: backlot-cache
          emptyDir:
            sizeLimit: 2Gi
        - name: tmp
          emptyDir:
            sizeLimit: 10Gi
        - name: node-cache
          emptyDir:
            sizeLimit: 10Gi
        - name: npm-cache
          emptyDir:
            sizeLimit: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: openmontage
  namespace: test
  labels:
    app.kubernetes.io/name: openmontage
    app.kubernetes.io/part-of: soulx
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: openmontage
  ports:
    - name: http
      port: 4750
      targetPort: http
      protocol: TCP
